services:
  # Local app startup applies pending schema changes before enabling file watching.
  app:
    build:
      context: .
      target: development
    command: >
      sh -c "npm run db:migrate && npm run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: local-development-key-8f3c2a91b7d64e50
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: seo_snippets
      DB_USER: app
      DB_PASSWORD: app
      DB_SSL: "false"
    volumes:
      # Keep installed Linux dependencies inside Docker while source remains editable.
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      database:
        condition: service_healthy
  # These credentials and the published port are for local development only.
  database:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: seo_snippets
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-plocal-root-password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app_node_modules:
  mysql_data:
